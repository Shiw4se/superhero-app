version: '3.8'

services:

  mongo:
    image: mongo:latest
    container_name: superhero_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # 2. Бэкенд
  backend:
    build: ./backend
    container_name: superhero_backend
    ports:
      - "5000:5000"
    environment:

      - MONGO_URL=mongodb://mongo:27017/superhero_db
      - PORT=5000
    depends_on:
      - mongo # Ждать запуска базы
    volumes:

      - ./backend:/app
      - /app/node_modules


  frontend:
    build: ./frontend
    container_name: superhero_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:

      - ./frontend:/app
      - /app/node_modules

volumes:
  mongo_data: